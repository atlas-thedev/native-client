<!doctype html>
<html><head><meta charset="utf-8"><title>NCM preview</title>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/examples/jsm/":"/node_modules/three/examples/jsm/","skinview-utils":"/node_modules/skinview-utils/build/index.js","skinview3d":"/node_modules/skinview3d/libs/skinview3d.js"}}</script>
<style>body{margin:0;background:#1b1d24;color:#ddd;font:12px sans-serif}canvas{display:block}</style></head>
<body><canvas id="c"></canvas><pre id="out"></pre>
<script type="module">
import * as THREE from 'three';
import * as skinview3d from 'skinview3d';
import { buildCosmetic, attachToPlayer, loadImage } from '/src/lib/ncm.js';
const q = new URLSearchParams(location.search);
const ids = (q.get('ids') || '').split(',').filter(Boolean);
const mode = q.get('mode') || 'player';     // player | thumb
const size = Number(q.get('size') || 256);
const time = Number(q.get('t') || 0.3);
const canvas = document.getElementById('c');
const results = {};
async function load(id) {
  const model = await (await fetch(`/server/store/assets/${id}.model.json`)).json();
  const b64 = (await (await fetch(`/server/store/assets/${id}.texture.png.b64`)).text()).trim();
  return { model, image: await loadImage('data:image/png;base64,' + b64) };
}
if (mode === 'player') {
  const viewer = new skinview3d.SkinViewer({ canvas, width: Number(q.get('w') || 900), height: Number(q.get('h') || 600), skin: '/scripts/cosmetics/steve.png', preserveDrawingBuffer: true });
  viewer.background = 0x2a2d38;
  viewer.zoom = Number(q.get('zoom') || 0.8);
  viewer.camera.position.set(Number(q.get('cx') || 22), Number(q.get('cy') || 12), Number(q.get('cz') || 38));
  viewer.camera.lookAt(0, 4, 0);
  viewer.controls.update();
  viewer.autoRotate = false;
  viewer.animation = null;
  for (const id of ids) { const { model, image } = await load(id); const b = attachToPlayer(buildCosmetic(THREE, model, image), viewer.playerObject.skin); b.update(time, 0); }
  viewer.render();
  await new Promise((r) => setTimeout(r, 300));
  viewer.render();
  document.body.dataset.ready = '1';
} else {
  // standalone thumbnails: transparent background, cosmetic only, nicely framed
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(size, size);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  for (const id of ids) {
    const scene = new THREE.Scene();
    scene.add(new THREE.AmbientLight(0xffffff, 1.7));
    const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(0.6, 1, 0.9); scene.add(sun);
    const { model, image } = await load(id);
    const b = buildCosmetic(THREE, model, image);
    const holder = new THREE.Group();
    // lay out each root where it sits on a player (attachment pivots in three.js space)
    // (shoes a little apart so the pair reads as two shoes)
    const pivots = { head: [0, 0, 0], body: [0, 0, 0], rightArm: [-5, -2, 0], leftArm: [5, -2, 0], rightLeg: [-2.6, -12, 0], leftLeg: [2.6, -12, 0] };
    for (const r of b.roots) { r.object.position.set(...pivots[r.attach]); holder.add(r.object); }
    b.update(time, 0);
    scene.add(holder);
    const section = q.get('section') || '';
    const view = { hats: [-0.55, 0.28], glasses: [-0.45, 0.1], back: [Math.PI * 0.8, 0.16], shoes: [-0.75, 0.05] }[section] || [-0.55, 0.12];
    holder.rotation.y = view[0];
    holder.rotation.x = view[1];
    holder.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(holder);
    const c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
    const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 1000);
    const dist = Math.max(s.x, s.y, s.z) * 2.1 + 4;
    camera.position.set(c.x, c.y + dist * (section === 'shoes' ? 0.06 : 0.15), c.z + dist);
    camera.lookAt(c);
    renderer.setClearColor(0x000000, 0);
    renderer.render(scene, camera);
    results[id] = canvas.toDataURL('image/png');
    b.dispose();
  }
  document.getElementById('out').textContent = JSON.stringify(results);
  document.body.dataset.ready = '1';
}
</script></body></html>
