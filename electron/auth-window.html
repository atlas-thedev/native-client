<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <title>Sign in to Microsoft — Native Client</title>
    <link rel="icon" type="image/png" href="../icon.png" />
    <style>
      :root {
        font-family: Inter, "Segoe UI", system-ui, sans-serif;
        color: #f9f4f5;
        background: #f4f4f4;
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        border: 1px solid #3a252b;
        background: #f4f4f4;
      }

      .titlebar {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        width: 100%;
        height: 58px;
        padding-left: 14px;
        border-bottom: 1px solid #3a252b;
        background:
          radial-gradient(circle at 18% -100%, rgba(239, 63, 56, 0.24), transparent 52%),
          #180e11;
        box-shadow: 0 5px 18px rgba(22, 9, 13, 0.2);
        -webkit-app-region: drag;
        user-select: none;
      }

      .brand {
        display: flex;
        align-items: center;
        min-width: 0;
        gap: 10px;
      }

      .brand img {
        width: 30px;
        height: 30px;
        object-fit: contain;
        filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.35));
      }

      .copy {
        min-width: 0;
        line-height: 1.15;
      }

      .title {
        overflow: hidden;
        color: #fff9fa;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.01em;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .subtitle {
        display: flex;
        align-items: center;
        gap: 5px;
        margin-top: 4px;
        color: #bca9ae;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .security-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #36c889;
        box-shadow: 0 0 8px rgba(54, 200, 137, 0.75);
      }

      .loading .security-dot {
        animation: pulse 1s ease-in-out infinite;
        background: #efb53f;
        box-shadow: 0 0 8px rgba(239, 181, 63, 0.7);
      }

      .window-actions {
        display: flex;
        align-self: stretch;
        margin-left: auto;
        -webkit-app-region: no-drag;
      }

      .window-button {
        display: grid;
        width: 46px;
        height: 100%;
        padding: 0;
        place-items: center;
        border: 0;
        color: #cbbbc0;
        background: transparent;
        cursor: pointer;
        transition: color 140ms ease, background 140ms ease;
      }

      .window-button:hover {
        color: #fff;
        background: rgba(255, 255, 255, 0.08);
      }

      .window-button.close:hover { background: #c42b36; }

      .window-button:focus-visible {
        outline: 2px solid #ef3f38;
        outline-offset: -3px;
      }

      .window-button svg {
        width: 15px;
        height: 15px;
        stroke: currentColor;
        stroke-width: 1.7;
        fill: none;
      }

      .loading-stage {
        display: grid;
        height: calc(100% - 58px);
        place-items: center;
        color: #5d5255;
        background: #f4f4f4;
      }

      .spinner {
        width: 24px;
        height: 24px;
        border: 2px solid #d9d2d4;
        border-top-color: #ef3f38;
        border-radius: 50%;
        animation: spin 700ms linear infinite;
      }

      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 50% { opacity: 0.45; } }
    </style>
  </head>
  <body class="loading">
    <header class="titlebar">
      <div class="brand">
        <img src="../src/assets/native-icon.png" alt="Native Client" />
        <div class="copy">
          <div class="title">Sign in to Microsoft</div>
          <div class="subtitle"><span class="security-dot"></span>Secure sign-in · Native Client</div>
        </div>
      </div>
      <div class="window-actions">
        <button class="window-button" id="minimize" type="button" aria-label="Minimize">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5h10" /></svg>
        </button>
        <button class="window-button close" id="close" type="button" aria-label="Close">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8" /></svg>
        </button>
      </div>
    </header>
    <main class="loading-stage" aria-label="Loading Microsoft sign-in">
      <div class="spinner"></div>
    </main>
    <script>
      const authBridge = window.nativeAuthWindow;
      document.getElementById('minimize').addEventListener('click', () => authBridge.minimize());
      document.getElementById('close').addEventListener('click', () => authBridge.close());
      authBridge.onLoadingChange((loading) => {
        document.body.classList.toggle('loading', loading);
      });
    </script>
  </body>
</html>
