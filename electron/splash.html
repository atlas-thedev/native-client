<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Native Client</title>
  <link rel="stylesheet" href="../src/styles/theme.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    html,
    body {
      height: 100%;
      background: transparent;
      font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
      overflow: hidden;
    }

    .splash {
      height: 100%;
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      background: linear-gradient(180deg, var(--panel-grad-1), var(--panel-grad-2));
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      -webkit-app-region: drag;
    }

    .cube {
      position: absolute;
      border-radius: 8px;
      background: var(--bg-raise);
      border: 1px solid var(--accent-border);
      pointer-events: none;
    }

    .cube-a {
      width: 40px;
      height: 40px;
      left: 40px;
      top: 42px;
      transform: rotate(-14deg);
    }

    .cube-b {
      width: 26px;
      height: 26px;
      right: 52px;
      bottom: 48px;
      transform: rotate(18deg);
    }

    .glow {
      position: absolute;
      width: 300px;
      height: 220px;
      border-radius: 50%;
      filter: blur(60px);
      pointer-events: none;
      background: var(--accent-soft);
    }

    .glow-a {
      top: -90px;
      left: -70px;
    }

    .glow-b {
      bottom: -110px;
      right: -80px;
      background: rgba(163, 31, 31, 0.28);
    }

    h1 {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: 6px;
      color: var(--text);
      background: linear-gradient(90deg, var(--text) 40%, var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .app-icon {
      width: 76px;
      height: 76px;
      object-fit: contain;
      filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.3));
    }

    .bar {
      width: 220px;
      height: 5px;
      border-radius: 3px;
      background: var(--bg-raise);
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 40%;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--accent-deep), var(--accent));
      animation: slide 1.1s ease-in-out infinite;
    }

    @keyframes slide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(340%); }
    }

    .status {
      font-size: 11px;
      letter-spacing: 0.4px;
      color: var(--text-dim);
    }
  </style>
</head>
<body>
  <div class="splash">
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>
    <div class="cube cube-a"></div>
    <div class="cube cube-b"></div>
    <img class="app-icon" src="../src/assets/noctra-icon.png" alt="" />
    <h1>NOCTRA</h1>
    <div class="bar"><div class="bar-fill"></div></div>
    <div class="status" id="status">Starting Native Client&hellip;</div>
  </div>
  <script>
    const messages = [
      'Checking for updates…',
      'Loading assets…',
      'Preparing launcher…'
    ];
    let i = 0;
    setInterval(() => {
      document.getElementById('status').textContent = messages[i++ % messages.length];
    }, 900);
  </script>
</body>
</html>
