  <style>
    /* Boot splash: painted from this file alone, before any JS or CSS
       bundle loads, then faded out once React has rendered the app. */
    html, body { margin: 0; background: #000; }
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: #000;
      -webkit-app-region: drag;
      user-select: none;
      transition: opacity 0.28s ease;
    }
    #boot-splash.is-done { opacity: 0; pointer-events: none; }
    #boot-splash img {
      width: 72px;
      height: 72px;
      animation: boot-in 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    #boot-splash .boot-name {
      font: 700 15px "Segoe UI", system-ui, -apple-system, sans-serif;
      letter-spacing: -0.01em;
      color: #fff;
      animation: boot-in 0.5s 0.06s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    #boot-splash .boot-bar {
      position: relative;
      width: 132px;
      height: 3px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.1);
      animation: boot-in 0.5s 0.12s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    #boot-splash .boot-bar::after {
      content: '';
      position: absolute;
      inset: 0 auto 0 0;
      width: 40%;
      border-radius: inherit;
      background: rgba(255, 255, 255, 0.75);
      animation: boot-slide 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }
    @keyframes boot-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) {
      #boot-splash img, #boot-splash .boot-name, #boot-splash .boot-bar { animation: none; }
      #boot-splash .boot-bar::after { animation-duration: 2.4s; }
    }
  </style>
</head>

  <script>
    // Called by the app once its first real screen is on screen.
    window.__noctraBootDone = function () {
      var el = document.getElementById('boot-splash');
      if (!el || el.classList.contains('is-done')) return;
      el.classList.add('is-done');
      setTimeout(function () { el.remove(); }, 320);
    };
    // Never trap the user behind the splash if startup fails.
    setTimeout(function () { window.__noctraBootDone(); }, 20000);
  </script>
