name: Release

# Builds Windows, macOS and Linux installers and publishes them as a GitHub Release.
#
# Trigger it by pushing a version tag (release.bat does this for you):
#   git tag v3.10.1 && git push origin v3.10.1
# or run it manually from the Actions tab (builds the version in package.json).

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Never try to code-sign on CI (builds are unsigned; mac config has identity: null).
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  # This repo is private: installers and update feeds go to the public releases-only repo, which is
  # what the launcher's auto-updater reads (package.json build.publish). RELEASES_TOKEN = fine-grained
  # token with Contents: read and write on atlas-thedev/native-client-releases.
  GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
  RELEASES_REPO: atlas-thedev/native-client-releases

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version and validate tag
        id: v
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${TAG}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION} (expected ${TAG}). Use release.bat so they stay in sync."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          # Versions like 4.2.12-beta.1 are beta builds: published as GitHub pre-releases,
          # which only beta testers' launchers pick up (stable users never see them).
          if [[ "${VERSION}" == *-* ]]; then PRE=true; else PRE=false; fi
          echo "prerelease=${PRE}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG} (prerelease=${PRE})"

      # One draft release up front so the three platform jobs all upload into the same
      # release instead of each racing to create its own.
      - name: Create draft release if missing
        shell: bash
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          if [ -z "$GH_TOKEN" ]; then echo "::error::RELEASES_TOKEN secret is not set"; exit 1; fi
          if gh release view "$TAG" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists, reusing it."
          else
            prev="$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)"
            { echo "## What's changed"; git log --no-merges --pretty='* %s' ${prev:+$prev..}HEAD | head -n 40; } > notes.md
            if [[ "${{ steps.v.outputs.prerelease }}" == "true" ]]; then
              gh release create "$TAG" --repo "$RELEASES_REPO" --draft --prerelease --title "Native Client $TAG (Beta)" --notes-file notes.md
            else
              gh release create "$TAG" --repo "$RELEASES_REPO" --draft --title "Native Client $TAG" --notes-file notes.md
            fi
          fi

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            flag: --win
          - name: macOS
            os: macos-latest
            flag: --mac
          - name: Linux
            os: ubuntu-latest
            flag: --linux
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build UI
        run: npx vite build

      - name: Package and upload to the release
        run: npx electron-builder ${{ matrix.flag }} --publish always

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Check all platforms uploaded, then publish
        shell: bash
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          PRE="${{ needs.prepare.outputs.prerelease }}"
          if [[ "$PRE" == "true" ]]; then FEEDS="beta.yml beta-mac.yml beta-linux.yml"; else FEEDS="latest.yml latest-mac.yml latest-linux.yml beta.yml beta-mac.yml beta-linux.yml"; fi
          NAMES=$(gh release view "$TAG" --repo "$RELEASES_REPO" --json assets --jq '.assets[].name')
          # Stable builds only get latest*.yml from electron-builder. Beta testers' launchers read beta*.yml,
          # so give them the same feeds: when a stable release is newer than their beta they move onto it.
          if [[ "$PRE" != "true" ]]; then
            mkdir -p feeds
            for pair in "latest.yml:beta.yml" "latest-mac.yml:beta-mac.yml" "latest-linux.yml:beta-linux.yml"; do
              src="${pair%%:*}"; dst="${pair##*:}"
              if grep -qx "$src" <<<"$NAMES" && ! grep -qx "$dst" <<<"$NAMES"; then
                gh release download "$TAG" --repo "$RELEASES_REPO" --pattern "$src" --dir feeds --clobber
                cp "feeds/$src" "feeds/$dst"
                gh release upload "$TAG" --repo "$RELEASES_REPO" "feeds/$dst" --clobber
                echo "Added $dst (copy of $src)"
              fi
            done
            NAMES=$(gh release view "$TAG" --repo "$RELEASES_REPO" --json assets --jq '.assets[].name')
          fi
          echo "$NAMES"
          missing=0
          for f in $FEEDS; do
            if ! grep -qx "$f" <<<"$NAMES"; then echo "::error::Missing $f"; missing=1; fi
          done
          grep -qE '\.exe$' <<<"$NAMES"      || { echo "::error::No Windows installer (.exe)"; missing=1; }
          grep -qE '\.dmg$' <<<"$NAMES"      || { echo "::error::No macOS disk image (.dmg)"; missing=1; }
          grep -qE '\.AppImage$' <<<"$NAMES" || { echo "::error::No Linux AppImage"; missing=1; }
          if [[ $missing -ne 0 ]]; then
            echo "::error::Release $TAG left as a draft because some platform builds are missing."
            exit 1
          fi
          if [[ "$PRE" == "true" ]]; then
            gh release edit "$TAG" --repo "$RELEASES_REPO" --draft=false --prerelease --latest=false
            echo "Published beta $TAG (pre-release, beta testers only)"
          else
            gh release edit "$TAG" --repo "$RELEASES_REPO" --draft=false --prerelease=false --latest
            echo "Published $TAG"
          fi
